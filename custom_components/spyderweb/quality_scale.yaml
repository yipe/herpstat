rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the small async HTTP client lives in api.py.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: /RAWSTATUS needs no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      The device advertises _http._tcp under its user-set nickname with no TXT records, and its MAC prefix is a
      generic Espressif one, so there is nothing reliable to match.
  discovery-update-info:
    status: exempt
    comment: No discovery; the reconfigure flow updates the address.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one physical thermostat.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One config entry is one physical thermostat; deleting the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
