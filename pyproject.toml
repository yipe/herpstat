[project]
name = "ha-spyderweb"
version = "0.1.0"
description = "Home Assistant integration for Herpstat SpyderWeb thermostats (dev/test environment)"
requires-python = ">=3.13.2,<3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.272",  # pins homeassistant==2025.8.3
    "pycares<5",  # aiodns 3.5 (pinned by HA 2025.8) breaks on pycares 5
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "RET", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
