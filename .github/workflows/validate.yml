name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily, as HACS recommends; also catches breaking changes in new Home Assistant releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
